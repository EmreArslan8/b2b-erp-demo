<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TedarikPro — B2B Sipariş, Cari & Stok Yönetimi</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<script src="js/icons.js"></script>
<div class="landing" id="root"></div>
<script>
document.getElementById("root").innerHTML = `

  <div class="logo">Tedarik<em>Pro</em></div>

  <h4>Müşteri sipariş linkleri</h4>
  <div class="landing-cards">
    <a class="card landing-card" href="siparis.html?musteri=yildiz-market">
      <div class="em">${ic("building")}</div>
      <h3>Yıldız Market Zinciri</h3>

      <div class="go">Sipariş ekranını aç ${ic("arrow")}</div>
    </a>
    <a class="card landing-card" href="siparis.html?musteri=gunes-bakkaliye">
      <div class="em">${ic("building")}</div>
      <h3>Güneş Bakkaliye</h3>

    </a>

    <a class="btn btn-dark" href="admin/index.html" style="font-size:15px;padding:13px 26px">${ic("grid")} Yönetim Paneline Gir</a>
  </div>

  <p class="note">Bu demo tamamen tarayıcıda çalışır; verdiğiniz siparişler anında yönetim paneline düşer. Gerçek sürümde kullanıcı girişi, veritabanı ve anlık bildirim altyapısı bulunur.<br><br>
  <button class="btn btn-ghost btn-sm" onclick="localStorage.removeItem('b2bErpDemo_v1');location.reload()">Demo verisini sıfırla</button></p>`;
</script>

</html>
