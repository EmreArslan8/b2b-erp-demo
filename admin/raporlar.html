<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raporlar — TedarikPro</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/admin.js"></script>
<script>
renderShell("Raporlar");

let tab = "ozet";
function onDataChange() { draw(); }

function draw() {
  document.getElementById("content").innerHTML = `
  <div class="tabs no-print">
    <button class="${tab === "ozet" ? "active" : ""}" onclick="tab='ozet';draw()">Satış Özeti</button>
    <button class="${tab === "urun" ? "active" : ""}" onclick="tab='urun';draw()">Ürün Bazlı</button>
    <button class="${tab === "musteri" ? "active" : ""}" onclick="tab='musteri';draw()">Müşteri Bazlı</button>
    <button class="${tab === "tedarikci" ? "active" : ""}" onclick="tab='tedarikci';draw()">Tedarikçi Bazlı</button>
    <button class="${tab === "kar" ? "active" : ""}" onclick="tab='kar';draw()">Kâr Raporu</button>
  </div>
  <div id="tabBody"></div>`;
  ({ ozet: rOzet, urun: rUrun, musteri: rMusteri, tedarikci: rTedarikci, kar: rKar }[tab])();
}

function activeOrders() { return Store.load().orders.filter(o => o.status !== "İptal Edildi"); }

function rOzet() {
  const orders = activeOrders();
  const today = new Date().toDateString();
  const monthKey = new Date().toISOString().slice(0, 7);
  const dayTotal = orders.filter(o => new Date(o.date).toDateString() === today).reduce((s, o) => s + Store.orderTotal(o).total, 0);
  const monthTotal = orders.filter(o => o.date.slice(0, 7) === monthKey).reduce((s, o) => s + Store.orderTotal(o).total, 0);
  const allTotal = orders.reduce((s, o) => s + Store.orderTotal(o).total, 0);

  // son 7 gün
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const key = d.toDateString();
    days.push({ label: d.toLocaleDateString("tr-TR", { day: "2-digit", month: "2-digit" }), sum: orders.filter(o => new Date(o.date).toDateString() === key).reduce((s, o) => s + Store.orderTotal(o).total, 0) });
  }
  const mx = Math.max(...days.map(d => d.sum), 1);

  document.getElementById("tabBody").innerHTML = `
  <div class="stats">
    <div class="card stat"><div class="k">Günlük Satış</div><div class="v">${tl(dayTotal)}</div></div>
    <div class="card stat"><div class="k">Aylık Satış</div><div class="v">${tl(monthTotal)}</div></div>
    <div class="card stat"><div class="k">Toplam Ciro</div><div class="v">${tl(allTotal)}</div><div class="sub">${orders.length} sipariş</div></div>
  </div>
  <div class="card card-pad"><h3 style="margin-bottom:14px">Son 7 Gün Satış Trendi</h3>
    <div class="bars">${days.map(d => `<div class="bar"><span class="val">${d.sum ? Math.round(d.sum / 1000) + "K" : ""}</span><div class="fill" style="height:${Math.max(4, d.sum / mx * 110)}px"></div><span class="lb">${d.label}</span></div>`).join("")}</div>
  </div>`;
}

function rUrun() {
  const map = {};
  activeOrders().forEach(o => o.items.forEach(i => {
    const p = Store.product(i.productId); if (!p) return;
    map[i.productId] = map[i.productId] || { name: p.name, unit: p.unit, qty: 0, rev: 0 };
    map[i.productId].qty += i.qty; map[i.productId].rev += i.qty * i.price;
  }));
  const rows = Object.values(map).sort((a, b) => b.rev - a.rev);
  const mx = Math.max(...rows.map(r => r.rev), 1);
  tableCard(["Ürün", "Satılan Miktar", "Ciro", "Pay"], rows.map(r => [
    `<b>${esc(r.name)}</b>`, `${r.qty} ${esc(r.unit)}`, tl(r.rev), bar(r.rev / mx)
  ]), [false, true, true, false]);
}

function rMusteri() {
  const rows = Store.load().customers.map(c => {
    const s = Store.cariSummary(c.id);
    return { name: c.name, count: s.orders.length, sales: s.sales, paid: s.paid, bal: s.balance };
  }).sort((a, b) => b.sales - a.sales);
  tableCard(["Müşteri", "Sipariş", "Ciro", "Tahsilat", "Bakiye"], rows.map(r => [
    `<b>${esc(r.name)}</b>`, r.count, tl(r.sales), `<span style="color:var(--green)">${tl(r.paid)}</span>`,
    `<b style="color:${r.bal > 0 ? "var(--red)" : "var(--green)"}">${tl(r.bal)}</b>`
  ]), [false, true, true, true, true]);
}

function rTedarikci() {
  const map = {};
  activeOrders().forEach(o => o.items.forEach(i => {
    const p = Store.product(i.productId); if (!p) return;
    map[p.supplierId] = map[p.supplierId] || { qty: 0, cost: 0, lines: 0 };
    map[p.supplierId].qty += i.qty; map[p.supplierId].cost += i.qty * p.cost; map[p.supplierId].lines++;
  }));
  const rows = Store.load().suppliers.map(s => ({ name: s.name, ...(map[s.id] || { qty: 0, cost: 0, lines: 0 }) })).sort((a, b) => b.cost - a.cost);
  tableCard(["Tedarikçi", "Sipariş Kalemi", "Toplam Adet", "Tedarik Maliyeti"], rows.map(r => [
    `<b>${esc(r.name)}</b>`, r.lines, r.qty, tl(r.cost)
  ]), [false, true, true, true]);
}

function rKar() {
  const rows = [];
  let tRev = 0, tCost = 0;
  activeOrders().forEach(o => {
    const rev = Store.orderTotal(o).total;
    const cost = Store.orderCost(o);
    tRev += rev; tCost += cost;
    rows.push({ no: o.no, cust: Store.customer(o.customerId).name, rev, cost, profit: rev - cost });
  });
  const margin = tRev ? ((tRev - tCost) / tRev * 100) : 0;
  document.getElementById("tabBody").innerHTML = `
  <div class="stats">
    <div class="card stat"><div class="k">Toplam Ciro</div><div class="v">${tl(tRev)}</div></div>
    <div class="card stat"><div class="k">Toplam Maliyet</div><div class="v">${tl(tCost)}</div></div>
    <div class="card stat"><div class="k">Brüt Kâr</div><div class="v green">${tl(tRev - tCost)}</div><div class="sub">%${margin.toFixed(1)} marj</div></div>
  </div>
  <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sipariş</th><th>Müşteri</th><th class="num">Ciro</th><th class="num">Maliyet</th><th class="num">Kâr</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><b>${esc(r.no)}</b></td><td>${esc(r.cust)}</td><td class="num">${tl(r.rev)}</td><td class="num">${tl(r.cost)}</td><td class="num"><b style="color:var(--green)">${tl(r.profit)}</b></td></tr>`).join("")}
  </tbody></table></div></div>`;
}

// yardımcılar
function bar(frac) {
  return `<div style="background:var(--line);border-radius:5px;height:9px;width:120px;max-width:100%;overflow:hidden"><div style="background:var(--green);height:100%;width:${Math.round(frac * 100)}%"></div></div>`;
}
function tableCard(heads, rows, nums) {
  document.getElementById("tabBody").innerHTML = `
  <div style="text-align:right;margin-bottom:10px" class="no-print"><button class="btn btn-ghost btn-sm" onclick="window.print()">🖨 Yazdır / PDF</button></div>
  <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr>${heads.map((h, i) => `<th class="${nums[i] ? "num" : ""}">${h}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(r => `<tr>${r.map((c, i) => `<td class="${nums[i] ? "num" : ""}">${c}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div></div>`;
}

draw();
</script>
</body>
</html>
