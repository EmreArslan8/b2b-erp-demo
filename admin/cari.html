<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cari & Tahsilat — TedarikPro</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script src="../js/icons.js"></script>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/admin.js"></script>
<script>
renderShell("Cari & Tahsilat", "Operasyon");

let openCust = null;
function onDataChange() { draw(); if (openCust) drawCard(); }

function draw() {
  const db = Store.load();
  const totalSales = db.customers.reduce((s, c) => s + Store.cariSummary(c.id).sales, 0);
  const totalPaid = db.customers.reduce((s, c) => s + Store.cariSummary(c.id).paid, 0);

  document.getElementById("content").innerHTML = `
  <div class="stats">
    <div class="card stat"><div class="k">Toplam Satış</div><div class="v">${tl(totalSales)}</div></div>
    <div class="card stat"><div class="k">Tahsil Edilen</div><div class="v green">${tl(totalPaid)}</div></div>
    <div class="card stat warn"><div class="k">Kalan Alacak</div><div class="v red">${tl(totalSales - totalPaid)}</div></div>
  </div>

  <div class="card"><div class="tbl-wrap"><table class="tbl"><thead><tr>
    <th>Cari Kod</th><th>Müşteri</th><th>İletişim</th><th class="num">Toplam Satış</th><th class="num">Tahsilat</th><th class="num">Bakiye</th><th></th>
  </tr></thead><tbody>
    ${db.customers.map(c => {
      const s = Store.cariSummary(c.id);
      return `<tr>
        <td><b>${esc(c.code)}</b></td>
        <td><b>${esc(c.name)}</b></td>
        <td style="font-size:13px">${esc(c.contact)}<br><span style="color:var(--ink-soft)">${esc(c.phone)}</span></td>
        <td class="num">${tl(s.sales)}</td>
        <td class="num" style="color:var(--green)">${tl(s.paid)}</td>
        <td class="num"><b style="color:${s.balance > 0 ? "var(--red)" : "var(--green)"}">${tl(s.balance)}</b></td>
        <td><button class="btn btn-primary btn-sm" onclick="openCari('${c.id}')">Cari Kart</button></td></tr>`;
    }).join("")}
  </tbody></table></div></div>

  <div class="modal-bg" id="cardModal"><div class="modal" style="max-width:760px" id="cardBox"></div></div>`;
}

function openCari(id) { openCust = id; drawCard(); document.getElementById("cardModal").classList.add("open"); }
function closeCari() { openCust = null; document.getElementById("cardModal").classList.remove("open"); draw(); }

function drawCard() {
  const c = Store.customer(openCust);
  const s = Store.cariSummary(openCust);
  const db = Store.load();
  const pays = db.payments.filter(p => p.customerId === openCust);

  document.getElementById("cardBox").innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap">
    <div><h3 style="margin-bottom:2px">${esc(c.name)}</h3>
      <div style="font-size:13px;color:var(--ink-soft)">${esc(c.code)} · ${esc(c.contact)} · ${esc(c.phone)}</div></div>
    <button class="btn btn-ghost btn-sm" onclick="closeCari()">✕ Kapat</button>
  </div>

  <div class="stats" style="margin:16px 0">
    <div class="card stat"><div class="k">Toplam Satış</div><div class="v" style="font-size:20px">${tl(s.sales)}</div></div>
    <div class="card stat"><div class="k">Tahsilat</div><div class="v green" style="font-size:20px">${tl(s.paid)}</div></div>
    <div class="card stat warn"><div class="k">Kalan Bakiye</div><div class="v ${s.balance > 0 ? "red" : "green"}" style="font-size:20px">${tl(s.balance)}</div></div>
  </div>

  <div class="card card-pad" style="margin-bottom:16px;background:var(--green-soft);border-color:var(--green)">
    <h3 style="font-size:15px;margin-bottom:10px">💳 Tahsilat Gir</h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:end">
      <div style="flex:1;min-width:120px"><label class="lbl">Tutar (₺)</label><input class="input" id="p_amt" type="number" step="0.01" placeholder="0,00"></div>
      <div><label class="lbl">Ödeme Tipi</label><select class="input" id="p_method"><option>Nakit</option><option>Havale</option><option>Kredi Kartı</option><option>Çek</option></select></div>
      <div style="flex:1;min-width:120px"><label class="lbl">İlgili Sipariş</label><select class="input" id="p_order"><option value="">Genel</option>${s.orders.map(o => `<option value="${o.id}">${esc(o.no)} — ${tl(Store.orderTotal(o).total)}</option>`).join("")}</select></div>
      <button class="btn btn-primary" onclick="addPay()">Kaydet</button>
    </div>
    <p style="font-size:12px;color:var(--ink-soft);margin-top:8px">Kısmi ödeme desteklenir; kalan bakiye otomatik güncellenir.</p>
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div>
      <h3 style="font-size:15px;margin-bottom:8px">Sipariş Geçmişi</h3>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>No</th><th>Durum</th><th class="num">Tutar</th></tr></thead><tbody>
        ${s.orders.length ? s.orders.map(o => `<tr class="clickable" onclick="location.href='siparisler.html?ord=${o.id}'"><td><b>${esc(o.no)}</b><br><span style="font-size:11px;color:var(--ink-soft)">${fmtDate(o.date)}</span></td><td>${statusBadge(o.status)}</td><td class="num">${tl(Store.orderTotal(o).total)}</td></tr>`).join("") : `<tr><td colspan="3"><div class="empty" style="padding:20px">Sipariş yok</div></td></tr>`}
      </tbody></table></div>
    </div>
    <div>
      <h3 style="font-size:15px;margin-bottom:8px">Tahsilat Geçmişi</h3>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tarih</th><th>Tip</th><th class="num">Tutar</th></tr></thead><tbody>
        ${pays.length ? pays.map(p => `<tr><td>${fmtDate(p.date)}</td><td>${esc(p.method)}</td><td class="num" style="color:var(--green)"><b>${tl(p.amount)}</b></td></tr>`).join("") : `<tr><td colspan="3"><div class="empty" style="padding:20px">Tahsilat yok</div></td></tr>`}
      </tbody></table></div>
    </div>
  </div>`;
}

function addPay() {
  const amt = parseFloat(document.getElementById("p_amt").value);
  if (!amt || amt <= 0) { toast("Geçerli bir tutar girin"); return; }
  Store.addPayment(openCust, document.getElementById("p_order").value || null, amt, document.getElementById("p_method").value);
  toast("💳 Tahsilat kaydedildi: " + tl(amt));
  drawCard();
}

draw();
</script>
</body>
</html>
