<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siparişler — TedarikPro</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<script src="../js/data.js"></script>
<script src="../js/store.js"></script>
<script src="../js/admin.js"></script>
<script>
renderShell("Sipariş Yönetimi");

let statusFilter = "Tümü";
let openOrderId = null;

function onDataChange() {
  drawList();
  if (openOrderId) { drawDetail(); document.getElementById("detailModal").classList.add("open"); }
}

function drawList() {
  const db = Store.load();
  const q = (document.getElementById("q")?.value || "").toLowerCase();
  const custF = document.getElementById("custF")?.value || "";

  const list = db.orders.filter(o => {
    if (statusFilter !== "Tümü" && o.status !== statusFilter) return false;
    if (custF && o.customerId !== custF) return false;
    if (q && !o.no.toLowerCase().includes(q) && !Store.customer(o.customerId).name.toLowerCase().includes(q)) return false;
    return true;
  });

  document.getElementById("content").innerHTML = `
  <div class="filters no-print">
    <div class="grow"><label class="lbl">Ara</label><input class="input" id="q" placeholder="Sipariş no veya müşteri…" value="${esc(q)}" oninput="drawList()"></div>
    <div><label class="lbl">Müşteri</label><select class="input" id="custF" onchange="drawList()">
      <option value="">Tümü</option>
      ${db.customers.map(c => `<option value="${c.id}" ${custF === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
    </select></div>
  </div>
  <div class="tabs no-print">
    ${["Tümü", ...ORDER_STATUSES].map(s => `<button class="${statusFilter === s ? "active" : ""}" onclick="statusFilter='${s}';drawList()">${s}</button>`).join("")}
  </div>
  <div class="card">
    <div class="tbl-wrap"><table class="tbl"><thead><tr>
      <th>Sipariş No</th><th>Müşteri</th><th>Tarih</th><th>Durum</th><th class="num">Kalem</th><th class="num">Tutar</th><th></th>
    </tr></thead><tbody>
      ${list.map(o => {
        const c = Store.customer(o.customerId);
        const t = Store.orderTotal(o);
        return `<tr>
          <td><b>${esc(o.no)}</b></td><td>${esc(c.name)}</td><td>${fmtDateTime(o.date)}</td>
          <td>${statusBadge(o.status)}</td><td class="num">${o.items.length}</td>
          <td class="num"><b>${tl(t.total)}</b></td>
          <td style="white-space:nowrap">
            <button class="btn btn-primary btn-sm" onclick="openDetail('${o.id}')">Aç</button>
            <button class="btn btn-ghost btn-sm" title="Yeni sipariş olarak kopyala" onclick="copyOrd('${o.id}')">⧉ Kopyala</button>
          </td></tr>`;
      }).join("") || `<tr><td colspan="7"><div class="empty">Filtreye uyan sipariş yok.</div></td></tr>`}
    </tbody></table></div>
  </div>

  <div class="modal-bg" id="detailModal"><div class="modal" style="max-width:820px" id="detailBox"></div></div>`;

  const f = document.getElementById("q");
  if (q) { f.focus(); f.setSelectionRange(q.length, q.length); }
}

function copyOrd(id) {
  const copy = Store.copyOrder(id);
  toast("⧉ " + Store.order(id).no + " → " + copy.no + " olarak kopyalandı");
  drawList();
}

function openDetail(id) {
  openOrderId = id;
  drawDetail();
  document.getElementById("detailModal").classList.add("open");
}
function closeDetail() {
  openOrderId = null;
  document.getElementById("detailModal").classList.remove("open");
  drawList();
}

function drawDetail() {
  const o = Store.order(openOrderId);
  if (!o) return;
  const c = Store.customer(o.customerId);
  const t = Store.orderTotal(o);
  const db = Store.load();

  // tedarikçiye göre grupla
  const bySup = {};
  o.items.forEach(i => {
    const p = Store.product(i.productId);
    const sid = p ? p.supplierId : "?";
    (bySup[sid] = bySup[sid] || []).push(i);
  });

  document.getElementById("detailBox").innerHTML = `
  <div style="display:flex;align-items:start;gap:12px;flex-wrap:wrap">
    <div style="flex:1">
      <h3 style="margin-bottom:2px">${esc(o.no)} ${statusBadge(o.status)}</h3>
      <div style="font-size:13px;color:var(--ink-soft)">${esc(c.name)} · ${fmtDateTime(o.date)}</div>
    </div>
    <button class="btn btn-ghost btn-sm" onclick="closeDetail()">✕ Kapat</button>
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin:16px 0">
    <div style="flex:1;min-width:180px"><label class="lbl">Durum Değiştir</label>
      <select class="input" onchange="Store.setStatus('${o.id}',this.value);toast('Durum güncellendi: '+this.value);drawDetail()">
        ${ORDER_STATUSES.map(s => `<option ${o.status === s ? "selected" : ""}>${s}</option>`).join("")}
      </select></div>
    <div style="align-self:end"><button class="btn btn-ghost" onclick="copyOrd('${o.id}');closeDetail()">⧉ Kopyala</button></div>
  </div>

  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ürün</th><th class="num">Adet</th><th class="num">Birim Fiyat</th><th class="num">Tutar</th><th></th></tr></thead><tbody>
    ${o.items.map((i, idx) => {
      const p = Store.product(i.productId);
      return `<tr>
        <td><b>${esc(p.name)}</b><br><span style="font-size:12px;color:var(--ink-soft)">${esc(Store.supplier(p.supplierId).name)} · ${esc(p.unit)}</span></td>
        <td class="num"><input class="input" type="number" min="1" value="${i.qty}" style="width:70px;padding:6px" onchange="editItem(${idx},'qty',this.value)"></td>
        <td class="num"><input class="input" type="number" step="0.01" min="0" value="${i.price}" style="width:90px;padding:6px" onchange="editItem(${idx},'price',this.value)"></td>
        <td class="num"><b>${tl(i.qty * i.price)}</b></td>
        <td><button class="btn btn-danger btn-sm" onclick="removeItem(${idx})">Sil</button></td></tr>`;
    }).join("")}
  </tbody></table></div>

  <div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:end">
    <div style="flex:1;min-width:200px"><label class="lbl">Ürün Ekle</label>
      <select class="input" id="addProd">
        ${db.products.filter(p => !o.items.some(i => i.productId === p.id)).map(p => `<option value="${p.id}">${esc(p.name)} — ${tl(Store.priceFor(p, o.customerId))}</option>`).join("")}
      </select></div>
    <button class="btn btn-primary btn-sm" onclick="addItem()">+ Ekle</button>
    <div><label class="lbl">İndirim (₺)</label><input class="input" type="number" min="0" value="${o.discount || 0}" style="width:110px" onchange="setDiscount(this.value)"></div>
  </div>

  <div style="text-align:right;margin:14px 0;font-size:15px">
    Ara toplam: <b>${tl(t.sub)}</b> &nbsp;·&nbsp; İndirim: <b style="color:var(--red)">−${tl(t.discount)}</b> &nbsp;·&nbsp;
    <span style="font-family:var(--font-display);font-size:20px;font-weight:800;color:var(--green)">Genel Toplam: ${tl(t.total)}</span>
  </div>

  <label class="lbl">Sipariş Notu</label>
  <textarea class="input" rows="2" onchange="setNote(this.value)">${esc(o.note || "")}</textarea>

  <h3 style="margin:20px 0 10px;font-size:16px">📦 Tedarikçi Bazlı Gruplama & PDF</h3>
  ${Object.keys(bySup).map(sid => {
    const s = Store.supplier(sid);
    const items = bySup[sid];
    const sum = items.reduce((x, i) => x + i.qty * i.price, 0);
    return `<div class="card card-pad" style="margin-bottom:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="flex:1;min-width:180px"><b>${esc(s.name)}</b><br>
        <span style="font-size:12.5px;color:var(--ink-soft)">${items.length} kalem · ${items.reduce((x, i) => x + i.qty, 0)} birim · ${tl(sum)}</span></div>
      <button class="btn btn-amber btn-sm" onclick="printSupplierPdf('${o.id}','${sid}')">🖨 PDF Oluştur</button>
    </div>`;
  }).join("")}
  <p style="font-size:12px;color:var(--ink-soft)">PDF, tarayıcının yazdırma penceresinden "PDF olarak kaydet" ile indirilir; WhatsApp veya e-posta ile manuel gönderilir. Sistem tedarikçiye otomatik gönderim yapmaz.</p>

  <h3 style="margin:18px 0 8px;font-size:16px">🕓 İşlem Geçmişi</h3>
  <div style="font-size:13px;color:var(--ink-soft)">
    ${o.log.slice().reverse().map(l => `<div style="padding:5px 0;border-bottom:1px dashed var(--line)"><b>${fmtDateTime(l.date)}</b> · ${esc(l.user)} — ${esc(l.text)}</div>`).join("")}
  </div>`;
}

function editItem(idx, field, val) {
  const o = Store.order(openOrderId);
  val = field === "qty" ? Math.max(1, parseInt(val) || 1) : Math.max(0, parseFloat(val) || 0);
  o.items[idx][field] = val;
  Store.logOrder(openOrderId, `${Store.product(o.items[idx].productId).name}: ${field === "qty" ? "adet" : "fiyat"} → ${val}`);
  drawDetail();
}
function removeItem(idx) {
  const o = Store.order(openOrderId);
  const nm = Store.product(o.items[idx].productId).name;
  o.items.splice(idx, 1);
  Store.logOrder(openOrderId, nm + " siparişten çıkarıldı");
  drawDetail();
}
function addItem() {
  const pid = document.getElementById("addProd").value;
  if (!pid) return;
  const o = Store.order(openOrderId);
  const p = Store.product(pid);
  o.items.push({ productId: pid, qty: 1, price: Store.priceFor(p, o.customerId) });
  Store.logOrder(openOrderId, p.name + " siparişe eklendi");
  drawDetail();
}
function setDiscount(v) {
  const o = Store.order(openOrderId);
  o.discount = Math.max(0, parseFloat(v) || 0);
  Store.logOrder(openOrderId, "İndirim: " + tl(o.discount));
  drawDetail();
}
function setNote(v) {
  const o = Store.order(openOrderId);
  o.note = v;
  Store.save();
  toast("Not kaydedildi");
}

function printSupplierPdf(orderId, supplierId) {
  const o = Store.order(orderId);
  const s = Store.supplier(supplierId);
  const c = Store.customer(o.customerId);
  const items = o.items.filter(i => Store.product(i.productId).supplierId === supplierId);
  document.getElementById("printArea").innerHTML = `
  <div class="pdf-doc">
    <h2>TedarikPro — Tedarikçi Sipariş Formu</h2>
    <div class="pdf-meta">
      <b>Tedarikçi:</b> ${esc(s.name)} (${esc(s.contact)} · ${esc(s.phone)})<br>
      <b>Sipariş:</b> ${esc(o.no)} · ${fmtDate(o.date)} &nbsp; <b>Müşteri:</b> ${esc(c.name)}<br>
      <b>Oluşturma:</b> ${fmtDateTime(new Date().toISOString())}
    </div>
    <table><thead><tr><th>#</th><th>Ürün</th><th>SKU</th><th>Birim</th><th>Adet</th></tr></thead><tbody>
      ${items.map((i, x) => {
        const p = Store.product(i.productId);
        return `<tr><td>${x + 1}</td><td>${esc(p.name)}</td><td>${esc(p.sku)}</td><td>${esc(p.unit)}</td><td>${i.qty}</td></tr>`;
      }).join("")}
    </tbody></table>
    <p style="margin-top:14px;font-size:12px">Bu form TedarikPro üzerinden oluşturulmuştur. Fiyat bilgisi içermez.</p>
  </div>`;
  window.print();
}

drawList();

// ?ord=... ile gelindiyse detayı aç
const p0 = new URLSearchParams(location.search).get("ord");
if (p0 && Store.order(p0)) openDetail(p0);
</script>
</body>
</html>
